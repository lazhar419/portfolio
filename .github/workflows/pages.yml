name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble portfolio
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r 'arpg关卡白盒demo' '解密关卡白盒demo' 'arpg关卡拆解' '解密类游戏拆解' _site/
          if [[ -d posters ]]; then
            cp -r posters _site/
          fi

          # Reject Git LFS pointers in the published site.
          shopt -s nullglob
          videos=(_site/arpg关卡白盒demo/*.mp4 _site/解密关卡白盒demo/*.mp4)
          [[ ${#videos[@]} -eq 3 ]]
          for video in "${videos[@]}"; do
            [[ $(stat --format=%s "$video") -gt 1024 ]]
            if head -c 128 "$video" | grep -aq '^version https://git-lfs.github.com/spec/v1'; then
              echo "Missing Git LFS object for $video" >&2
              exit 1
            fi
          done
          [[ $(du -sb _site | cut -f1) -lt 1000000000 ]]

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
